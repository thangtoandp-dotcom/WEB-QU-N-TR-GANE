<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chọc Quả - Thử Tài Toán Học Lớp 12</title>
    
    <!-- Tích hợp thư viện KaTeX để hiển thị công thức Toán học -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; 
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            font-size: 26px;
            font-weight: bold;
            color: #333;
            border: 3px solid #a4de02;
        }

        #score-display { color: #ff4500; font-size: 30px;}

        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        #instructions span {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 18px;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Giao diện Bảng Câu Hỏi */
        #quiz-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .quiz-container {
            background: #fff;
            width: 90%;
            max-width: 700px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 4px solid #4CAF50;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .quiz-title {
            color: #4CAF50;
            margin-top: 0;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quiz-question {
            font-size: 34px; /* Tăng cỡ chữ câu hỏi lên 34px */
            color: #222;
            margin: 25px 0;
            line-height: 1.6;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            border-left: 5px solid #2196F3;
            font-weight: bold; /* Thêm độ đậm cho dễ đọc */
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .option-btn {
            background: #f0f8ff;
            border: 2px solid #87CEFA;
            padding: 15px 10px;
            font-size: 28px; /* Tăng cỡ chữ đáp án lên 28px */
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70px;
        }

        .option-btn:hover {
            background: #e0f0ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-color: #2196F3;
        }

        .option-btn:active {
            transform: translateY(1px);
        }

        /* Đảm bảo hiển thị tốt trên màn hình nhỏ */
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .quiz-question { font-size: 26px; padding: 15px; } /* Tăng trên mobile */
            .option-btn { font-size: 22px; padding: 12px; min-height: 60px; } /* Tăng trên mobile */
        }

        /* Giao diện giới thiệu Tác giả */
        #intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #080914; /* Màu nền xanh đen trầm */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            transition: opacity 0.5s ease;
        }

        .intro-title {
            font-size: 26px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .intro-author {
            color: #ffda00; /* Màu vàng */
            font-size: clamp(24px, 6.5vw, 54px); /* Thu phóng thông minh, tối đa 54px, tối thiểu 24px */
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 218, 0, 0.8), 0 0 30px rgba(255, 218, 0, 0.5); /* Hiệu ứng phát sáng */
            white-space: nowrap; /* Bắt buộc viết trên 1 hàng */
        }

        .intro-school {
            color: #00d2ff; /* Màu xanh lơ */
            font-size: clamp(20px, 4vw, 32px);
            font-weight: 700;
            margin-bottom: 50px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
        }

        .intro-btn {
            background: transparent;
            color: white;
            border: 2px solid #00d2ff;
            padding: 12px 50px;
            font-size: 22px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .intro-btn:hover {
            background: rgba(0, 210, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Màn hình giới thiệu tác giả -->
    <div id="intro-screen">
        <div class="intro-title">TÁC GIẢ GAME</div>
        <div class="intro-author">Thầy giáo BÙI NGỌC THẮNG</div>
        <div class="intro-school">Trường THPT Đan Phượng</div>
        <button class="intro-btn" onclick="startGame()">Tiếp Tục</button>
    </div>

    <div id="ui">
        <div class="panel">
            Điểm: <span id="score-display">0</span>
        </div>
    </div>

    <div id="instructions">
        <span>Di chuyển chạm để chọc quả. Trả lời đúng để ghi điểm!</span>
    </div>

    <!-- Modal Câu hỏi -->
    <div id="quiz-modal">
        <div class="quiz-container">
            <h2 class="quiz-title" id="q-title">Câu hỏi Toán học</h2>
            <div class="quiz-question" id="q-text">Đang tải câu hỏi...</div>
            <div class="options-grid" id="q-options">
                <!-- Các nút sẽ được tạo bằng JS -->
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- NGÂN HÀNG CÂU HỎI TOÁN LỚP 12 (VECTƠ KHÔNG GIAN) ---
        // Sắp xếp theo mức độ từ dễ đến khó
        const questionBank = [
            // Mức độ: Dễ (Nhận biết)
            { q: "Tọa độ của vectơ $\\vec{a} = 2\\vec{i} - 3\\vec{j} + \\vec{k}$ là?", a: "$(2; -3; 1)$", w1: "$(2; 3; 1)$", w2: "$(-3; 2; 1)$", w3: "$(2; -3; 0)$" },
            { q: "Trong không gian $Oxyz$, cho $A(1; 2; 3), B(3; 0; 1)$. Tọa độ trung điểm $I$ của đoạn thẳng $AB$ là?", a: "$(2; 1; 2)$", w1: "$(4; 2; 4)$", w2: "$(1; -1; -1)$", w3: "$(2; 1; 0)$" },
            { q: "Cho hai vectơ $\\vec{a} = (1; 2; -1)$ và $\\vec{b} = (2; -1; 3)$. Tìm tọa độ của vectơ $\\vec{c} = \\vec{a} + \\vec{b}$.", a: "$(3; 1; 2)$", w1: "$(3; 1; -4)$", w2: "$(-1; 3; -4)$", w3: "$(2; -2; -3)$" },
            { q: "Tính độ dài của vectơ $\\vec{u} = (1; -2; 2)$.", a: "$3$", w1: "$5$", w2: "$\\sqrt{5}$", w3: "$9$" },
            // Mức độ: Trung bình (Thông hiểu)
            { q: "Tính khoảng cách giữa hai điểm $A(1; 0; -2)$ và $B(2; 1; -1)$.", a: "$\\sqrt{3}$", w1: "$3$", w2: "$\\sqrt{5}$", w3: "$1$" },
            { q: "Tính tích vô hướng $\\vec{a} \\cdot \\vec{b}$ với $\\vec{a}=(1; -1; 2)$ và $\\vec{b}=(2; 1; -1)$.", a: "$-1$", w1: "$1$", w2: "$-5$", w3: "$3$" },
            { q: "Tìm tham số $m$ để vectơ $\\vec{u} = (2; -1; 1)$ vuông góc với $\\vec{v} = (m; 3; -1)$.", a: "$m = 2$", w1: "$m = -2$", w2: "$m = 1$", w3: "$m = 0$" },
            { q: "Tìm tọa độ trọng tâm $G$ của tam giác $ABC$ biết $A(1;2;3), B(-1;0;1), C(3;1;2)$.", a: "$(1; 1; 2)$", w1: "$(3; 3; 6)$", w2: "$(1; -1; 2)$", w3: "$(0; 1; 2)$" },
            { q: "Mặt cầu $(S): (x-1)^2 + (y+2)^2 + (z-3)^2 = 9$ có tâm $I$ và bán kính $R$ là?", a: "$I(1; -2; 3), R=3$", w1: "$I(-1; 2; -3), R=3$", w2: "$I(1; -2; 3), R=9$", w3: "$I(-1; 2; -3), R=9$" },
            { q: "Cho $\\vec{a}=(1; 2; 2)$ và $\\vec{b}=(2; -1; 2)$. Tính giá trị $\\cos(\\vec{a}, \\vec{b})$.", a: "$\\frac{4}{9}$", w1: "$\\frac{2}{3}$", w2: "$-\\frac{4}{9}$", w3: "$\\frac{1}{2}$" },
            // Mức độ: Khó vừa (Vận dụng)
            { q: "Tính tọa độ tích có hướng $[\\vec{a}, \\vec{b}]$ với $\\vec{a}=(1; 2; 1)$ và $\\vec{b}=(2; -1; 3)$.", a: "$(7; -1; -5)$", w1: "$(7; 1; -5)$", w2: "$(5; -1; -5)$", w3: "$(-7; 1; 5)$" },
            { q: "Phương trình mặt phẳng $(ABC)$ đi qua $A(1;0;0), B(0;2;0), C(0;0;3)$ là?", a: "$\\frac{x}{1} + \\frac{y}{2} + \\frac{z}{3} = 1$", w1: "$x + 2y + 3z = 1$", w2: "$\\frac{x}{1} + \\frac{y}{2} + \\frac{z}{3} = 0$", w3: "$6x + 3y + 2z - 1 = 0$" },
            { q: "Viết phương trình mặt phẳng đi qua $M(1; -2; 3)$ và có vectơ pháp tuyến $\\vec{n}=(2; 1; -1)$.", a: "$2x + y - z + 3 = 0$", w1: "$2x + y - z - 3 = 0$", w2: "$x - 2y + 3z - 14 = 0$", w3: "$2x - y + z - 7 = 0$" },
            { q: "Tính khoảng cách từ điểm $M(1; -1; 2)$ đến mặt phẳng $(P): 2x - y + 2z - 1 = 0$.", a: "$2$", w1: "$\\frac{2}{3}$", w2: "$1$", w3: "$6$" },
            { q: "Tính diện tích tam giác $ABC$ biết $A(0;0;0), B(1;0;0), C(0;1;1)$.", a: "$\\frac{\\sqrt{2}}{2}$", w1: "$\\sqrt{2}$", w2: "$\\frac{1}{2}$", w3: "$1$" },
            // Mức độ: Khó (Vận dụng cao)
            { q: "Tính thể tích khối tứ diện $ABCD$ với $A(1;0;0), B(0;1;0), C(0;0;1), D(1;1;1)$.", a: "$\\frac{1}{3}$", w1: "$\\frac{1}{6}$", w2: "$\\frac{2}{3}$", w3: "$1$" },
            { q: "Đường thẳng $\\Delta$ đi qua $A(1; 2; 3)$ và vuông góc với mặt phẳng $(P): x - 2y + z + 1 = 0$ có phương trình là?", a: "$\\frac{x-1}{1} = \\frac{y-2}{-2} = \\frac{z-3}{1}$", w1: "$\\frac{x-1}{1} = \\frac{y+2}{2} = \\frac{z-3}{1}$", w2: "$\\frac{x+1}{1} = \\frac{y+2}{-2} = \\frac{z+3}{1}$", w3: "$\\frac{x-1}{-1} = \\frac{y-2}{2} = \\frac{z-3}{1}$" },
            { q: "Tìm tọa độ điểm $A'$ đối xứng với $A(1; 2; -1)$ qua mặt phẳng $(P): x + y - z + 2 = 0$.", a: "$(-3; -2; 3)$", w1: "$(-1; 0; 1)$", w2: "$(2; 3; -2)$", w3: "$(-2; -1; 2)$" },
            { q: "Góc giữa đường thẳng $d: \\frac{x-1}{1} = \\frac{y}{-1} = \\frac{z+2}{\\sqrt{2}}$ và mặt phẳng $(P): x + y + \\sqrt{2}z - 1 = 0$ bằng bao nhiêu?", a: "$30^\\circ$", w1: "$60^\\circ$", w2: "$45^\\circ$", w3: "$90^\\circ$" },
            { q: "Cho hai vectơ $\\vec{a}, \\vec{b}$ thỏa mãn $|\\vec{a}|=1, |\\vec{b}|=2, (\\vec{a}, \\vec{b}) = 60^\\circ$. Tính độ dài vectơ $\\vec{u} = 2\\vec{a} - \\vec{b}$.", a: "$2$", w1: "$\\sqrt{3}$", w2: "$2\\sqrt{2}$", w3: "$4$" }
        ];

        let currentQuestionIndex = 0;
        let isQuizActive = false;
        let isProcessingHit = false; // Biến kiểm soát trạng thái từ lúc đâm trúng đến lúc trả lời xong
        let currentTargetFruit = null;
        let correctOptionIndex = -1;
        let isIntroActive = true; // Cờ kiểm soát màn hình giới thiệu ban đầu

        // --- HÀM BẮT ĐẦU GAME TỪ MÀN HÌNH CHÀO MỪNG ---
        function startGame() {
            isIntroActive = false; // Mở khóa thao tác
            const introScreen = document.getElementById('intro-screen');
            introScreen.style.opacity = '0'; // Hiệu ứng mờ dần
            setTimeout(() => {
                introScreen.style.display = 'none'; // Ẩn hoàn toàn sau 0.5s
            }, 500);
            initAudio(); // Khởi tạo AudioContext khi người dùng có tương tác click đầu tiên
        }

        // --- HỆ THỐNG ÂM THANH WEB AUDIO API ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, startTimeOffset, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            
            const start = audioCtx.currentTime + startTimeOffset;
            
            gain.gain.setValueAtTime(vol, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(start);
            osc.stop(start + duration);
        }

        function playCorrectSound() {
            // Hợp âm C major arpeggio
            playTone(523.25, 'sine', 0.15, 0);       // C5
            playTone(659.25, 'sine', 0.15, 0.1);     // E5
            playTone(783.99, 'sine', 0.3, 0.2, 0.15);// G5
        }

        function playWrongSound() {
            // Âm thanh trầm, sai lầm
            playTone(300, 'square', 0.15, 0, 0.1);
            playTone(200, 'square', 0.3, 0.15, 0.15);
        }

        // --- CẤU TRÚC GAME ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');

        let width, height;
        let score = 0;
        let isGameRunning = true;

        const player = {
            x: 0, y: 0, targetX: 0,
            width: 40, height: 60,
            stickBaseLength: 80, stickMaxLength: 350,
            currentStickLength: 80,
            isPoking: false, pokeSpeed: 30, pokeRetractSpeed: 15
        };

        const tree = { x: 0, y: 0, trunkWidth: 80, trunkHeight: 300, canopyRadius: 250 };
        let fruits = [];
        const maxFruits = 45;
        let floatingTexts = [];
        let particles = []; // Hạt pháo hoa

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            tree.x = width / 2;
            tree.y = height - 100 - tree.trunkHeight;
            player.y = height - 100;
            if(player.x === 0) {
                player.x = width / 2 - 150;
                player.targetX = player.x;
            }
        }
        window.addEventListener('resize', resize);

        const colors = ['#FF0800', '#FF2400', '#FF4500', '#DC143C', '#B22222'];
        function spawnFruit() {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * (tree.canopyRadius - 20);
            return {
                x: tree.x + Math.cos(angle) * r,
                y: tree.y - tree.canopyRadius * 0.3 + Math.sin(angle) * r * 0.8,
                radius: 12 + Math.random() * 4,
                isFalling: false, vy: 0, rotation: Math.random() * Math.PI,
                color: colors[Math.floor(Math.random() * colors.length)],
                triggerQuizOnGround: false // Cờ đánh dấu quả sẽ kích hoạt câu hỏi khi chạm đất
            };
        }

        function initFruits() {
            fruits = [];
            for (let i = 0; i < maxFruits; i++) fruits.push(spawnFruit());
        }

        // --- XỬ LÝ SỰ KIỆN ---
        function updatePlayerTarget(x) {
            if (isIntroActive || isQuizActive || isProcessingHit) return; // Không cho di chuyển khi đang hỏi hoặc chờ quả rơi
            player.targetX = Math.max(player.width/2, Math.min(width - player.width/2, x));
        }

        function triggerPoke(e) {
            if (isIntroActive || isQuizActive || isProcessingHit) return; // Không cho chọc nếu đang hiển thị câu hỏi hoặc chờ quả rơi
            initAudio(); // Khởi tạo âm thanh
            if (!player.isPoking && player.currentStickLength <= player.stickBaseLength) {
                player.isPoking = true;
            }
        }

        canvas.addEventListener('mousemove', (e) => updatePlayerTarget(e.clientX));
        canvas.addEventListener('mousedown', triggerPoke);
        canvas.addEventListener('touchstart', (e) => {
            updatePlayerTarget(e.touches[0].clientX);
            triggerPoke(e);
        });
        canvas.addEventListener('touchmove', (e) => updatePlayerTarget(e.touches[0].clientX));

        // --- LOGIC TRẮC NGHIỆM ---
        function showQuiz(fruit) {
            isQuizActive = true;
            currentTargetFruit = fruit;
            
            const qData = questionBank[currentQuestionIndex];
            document.getElementById('q-title').innerText = `Câu hỏi số ${currentQuestionIndex + 1}`;
            
            // Xáo trộn đáp án
            let optsArr = [
                { text: qData.a, isCorrect: true },
                { text: qData.w1, isCorrect: false },
                { text: qData.w2, isCorrect: false },
                { text: qData.w3, isCorrect: false }
            ];
            optsArr.sort(() => Math.random() - 0.5);
            
            // Tìm vị trí đáp án đúng sau khi xáo
            correctOptionIndex = optsArr.findIndex(opt => opt.isCorrect);

            // Gán nội dung
            document.getElementById('q-text').innerText = qData.q;
            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = '';
            
            const labels = ['A', 'B', 'C', 'D'];
            optsArr.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<b>${labels[idx]}.</b>&nbsp; ${opt.text}`;
                btn.onclick = () => submitAnswer(idx);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quiz-modal').style.display = 'flex';

            // Render lại Toán học bằng KaTeX
            renderMathInElement(document.getElementById('quiz-modal'), {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false}
                ],
                throwOnError: false
            });
        }

        function spawnFireworks(x, y) {
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    life: 1,
                    size: Math.random() * 4 + 3
                });
            }
        }

        function submitAnswer(selectedIndex) {
            document.getElementById('quiz-modal').style.display = 'none';
            isQuizActive = false;
            isProcessingHit = false; // Mở khóa tương tác

            if (selectedIndex === correctOptionIndex) {
                // ĐÚNG
                playCorrectSound();
                spawnFireworks(currentTargetFruit.x, currentTargetFruit.y - 20);
                
                floatingTexts.push({
                    x: currentTargetFruit.x, y: currentTargetFruit.y - 40,
                    text: 'Chính xác! +5đ',
                    color: '#00FF00', opacity: 1, vy: -1.5, size: 28, fw: 'bold'
                });

                score += 5;
                scoreDisplay.innerText = score;
            } else {
                // SAI
                playWrongSound();
                floatingTexts.push({
                    x: currentTargetFruit.x, y: currentTargetFruit.y - 40,
                    text: 'Sai rồi!',
                    color: '#FF0000', opacity: 1, vy: -1, size: 28, fw: 'bold'
                });
            }

            // Dù đúng hay sai, quả sau khi nằm trên đất sẽ tiếp tục rơi hẳn ra ngoài màn hình
            currentTargetFruit.isFalling = true;
            currentTargetFruit.vy = -3; // Nảy nhẹ lên rồi rơi mất

            // Tăng câu hỏi, nếu hết 20 câu thì quay lại câu 1
            currentQuestionIndex = (currentQuestionIndex + 1) % questionBank.length;
        }


        // --- VẼ ĐỒ HỌA ---
        function drawBackground() {
            let skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#87CEEB'); 
            skyGradient.addColorStop(1, '#E0F6FF'); 
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.beginPath();
            ctx.arc(width - 100, 100, 50, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD700'; ctx.fill();
            ctx.beginPath();
            ctx.arc(width - 100, 100, 70, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 215, 0, 0.2)'; ctx.fill();

            drawCloud(150, 120, 0.8);
            drawCloud(width / 2 - 100, 80, 1.2);
            drawCloud(width - 250, 150, 0.9);

            let grassGradient = ctx.createLinearGradient(0, height - 150, 0, height);
            grassGradient.addColorStop(0, '#a4de02'); 
            grassGradient.addColorStop(1, '#7cb302'); 
            
            ctx.beginPath();
            ctx.moveTo(0, height - 80);
            ctx.quadraticCurveTo(width / 4, height - 120, width / 2, height - 90);
            ctx.quadraticCurveTo(width * 3 / 4, height - 60, width, height - 100);
            ctx.lineTo(width, height); ctx.lineTo(0, height);
            ctx.closePath();
            ctx.fillStyle = grassGradient; ctx.fill();
        }

        function drawCloud(x, y, scale) {
            ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
            ctx.beginPath();
            ctx.arc(0, 0, 30, Math.PI * 0.5, Math.PI * 1.5);
            ctx.arc(25, -20, 35, Math.PI * 1, Math.PI * 2);
            ctx.arc(60, -10, 30, Math.PI * 1.2, Math.PI * 2);
            ctx.arc(75, 0, 25, Math.PI * 1.5, Math.PI * 0.5);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.fill();
            ctx.restore();
        }

        function drawTree() {
            ctx.fillStyle = '#654321';
            ctx.beginPath();
            ctx.moveTo(tree.x - tree.trunkWidth / 2, tree.y + tree.trunkHeight);
            ctx.quadraticCurveTo(tree.x - tree.trunkWidth / 3, tree.y + tree.trunkHeight / 2, tree.x - tree.trunkWidth / 2 + 10, tree.y);
            ctx.lineTo(tree.x + tree.trunkWidth / 2 - 10, tree.y);
            ctx.quadraticCurveTo(tree.x + tree.trunkWidth / 3, tree.y + tree.trunkHeight / 2, tree.x + tree.trunkWidth / 2 + 20, tree.y + tree.trunkHeight);
            ctx.fill();

            // Rễ và ngọn cỏ che rễ
            ctx.beginPath();
            ctx.moveTo(tree.x - tree.trunkWidth / 2, tree.y + tree.trunkHeight);
            ctx.quadraticCurveTo(tree.x - tree.trunkWidth, tree.y + tree.trunkHeight + 20, tree.x - tree.trunkWidth - 30, tree.y + tree.trunkHeight + 10);
            ctx.strokeStyle = '#654321'; ctx.lineWidth = 15; ctx.lineCap = 'round'; ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(tree.x + tree.trunkWidth / 2 + 15, tree.y + tree.trunkHeight - 5);
            ctx.quadraticCurveTo(tree.x + tree.trunkWidth, tree.y + tree.trunkHeight + 20, tree.x + tree.trunkWidth + 40, tree.y + tree.trunkHeight + 15);
            ctx.stroke();
            
            // Cỏ mọc chân rễ
            ctx.fillStyle = '#a4de02';
            for(let i = -60; i <= 60; i+=15) {
                ctx.beginPath();
                ctx.moveTo(tree.x + i, tree.y + tree.trunkHeight + 20);
                ctx.lineTo(tree.x + i + 5, tree.y + tree.trunkHeight - Math.random()*25 - 10);
                ctx.lineTo(tree.x + i + 12, tree.y + tree.trunkHeight + 20);
                ctx.fill();
            }

            ctx.fillStyle = '#228B22';
            const drawLeafCluster = (cx, cy, r) => {
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx - r*0.2, cy - r*0.2, r*0.6, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; ctx.fill();
                ctx.fillStyle = '#228B22';
            };

            drawLeafCluster(tree.x, tree.y - 100, tree.canopyRadius);
            drawLeafCluster(tree.x - 120, tree.y - 50, tree.canopyRadius * 0.7);
            drawLeafCluster(tree.x + 130, tree.y - 30, tree.canopyRadius * 0.75);
            drawLeafCluster(tree.x - 180, tree.y - 150, tree.canopyRadius * 0.6);
            drawLeafCluster(tree.x + 180, tree.y - 120, tree.canopyRadius * 0.6);
            drawLeafCluster(tree.x, tree.y - 220, tree.canopyRadius * 0.8);
        }

        function drawFruits() {
            fruits.forEach(fruit => {
                ctx.save();
                ctx.translate(fruit.x, fruit.y);
                ctx.rotate(fruit.rotation);

                ctx.beginPath(); ctx.moveTo(0, -fruit.radius); ctx.lineTo(0, -fruit.radius - 8);
                ctx.strokeStyle = '#3CB371'; ctx.lineWidth = 3; ctx.stroke();

                ctx.beginPath(); ctx.ellipse(5, -fruit.radius - 6, 6, 3, Math.PI/4, 0, Math.PI*2);
                ctx.fillStyle = '#3CB371'; ctx.fill();

                ctx.beginPath(); ctx.arc(0, 0, fruit.radius, 0, Math.PI * 2);
                ctx.fillStyle = fruit.color; ctx.fill();
                
                ctx.beginPath(); ctx.arc(-fruit.radius*0.3, -fruit.radius*0.3, fruit.radius*0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.fill();
                ctx.restore();
            });
        }

        function drawPlayer() {
            ctx.save(); ctx.translate(player.x, player.y);

            ctx.beginPath(); ctx.moveTo(15, 20); ctx.lineTo(15, 20 - player.currentStickLength);
            ctx.strokeStyle = '#D2B48C'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
            ctx.beginPath();
            for(let i = 20; i >= 20 - player.currentStickLength; i-=40) {
                ctx.moveTo(12, i); ctx.lineTo(18, i);
            }
            ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2; ctx.stroke();

            ctx.beginPath(); ctx.arc(0, -30, 18, 0, Math.PI * 2); ctx.fillStyle = '#FFDAB9'; ctx.fill();
            ctx.beginPath(); ctx.arc(0, -32, 19, Math.PI, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill();
            ctx.beginPath(); ctx.roundRect(-15, -12, 30, 35, 8); ctx.fillStyle = '#FFA500'; ctx.fill();
            ctx.beginPath(); ctx.roundRect(-15, 15, 30, 15, 5); ctx.fillStyle = '#4169E1'; ctx.fill();
            ctx.fillStyle = '#FFDAB9'; ctx.fillRect(-10, 30, 8, 15); ctx.fillRect(2, 30, 8, 15);
            ctx.beginPath(); ctx.moveTo(-10, -5); ctx.lineTo(15, 10);
            ctx.strokeStyle = '#FFDAB9'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.stroke();

            ctx.restore();
        }

        function drawEffects() {
            // Hạt pháo hoa
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.3; // trọng lực hạt
                p.life -= 0.02;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.globalAlpha = p.life;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Chữ bay
            floatingTexts.forEach(ft => {
                ctx.font = `${ft.fw || 'normal'} ${ft.size || 24}px Arial`;
                ctx.fillStyle = ft.color || `rgba(255, 69, 0, ${ft.opacity})`;
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 4;
                ctx.globalAlpha = ft.opacity;
                ctx.strokeText(ft.text, ft.x - ctx.measureText(ft.text).width/2, ft.y);
                ctx.fillText(ft.text, ft.x - ctx.measureText(ft.text).width/2, ft.y);
            });
            ctx.globalAlpha = 1;
        }

        // --- CẬP NHẬT LOGIC ---
        function update() {
            if (isQuizActive) return; // Đóng băng logic game khi hiển thị câu hỏi

            player.x += (player.targetX - player.x) * 0.15;

            if (player.isPoking) {
                player.currentStickLength += player.pokeSpeed;
                if (player.currentStickLength >= player.stickMaxLength) player.isPoking = false;
            } else {
                if (player.currentStickLength > player.stickBaseLength) {
                    player.currentStickLength -= player.pokeRetractSpeed;
                } else {
                    player.currentStickLength = player.stickBaseLength;
                }
            }

            const stickTipX = player.x + 15;
            const stickTipY = player.y + 20 - player.currentStickLength;

            fruits.forEach((fruit, index) => {
                if (!fruit.isFalling) {
                    if (player.currentStickLength > player.stickBaseLength + 20) {
                        const dist = Math.hypot(stickTipX - fruit.x, stickTipY - fruit.y);
                        if (dist < fruit.radius + 15 && !isProcessingHit) { 
                            isProcessingHit = true; // Khóa tương tác
                            player.isPoking = false; // Ngừng đâm sào, bắt đầu thu sào về
                            
                            fruit.isFalling = true; // Quả bắt đầu rơi
                            fruit.vy = -2; // Bật nảy lên một chút trước khi rơi
                            fruit.triggerQuizOnGround = true; // Đánh dấu sẽ hiện quiz khi chạm đất
                        }
                    }
                } else {
                    if (fruit.triggerQuizOnGround) {
                        // Trạng thái quả đang rơi xuống đất
                        fruit.vy += 0.5; 
                        fruit.y += fruit.vy;
                        fruit.rotation += 0.05;

                        // Chạm đất (tọa độ y đất khoảng height - 90)
                        if (fruit.y >= height - 90) {
                            fruit.y = height - 90; // Giữ quả ở mặt đất
                            fruit.triggerQuizOnGround = false;
                            showQuiz(fruit); // Hiện bảng câu hỏi
                        }
                    } else {
                        // Trạng thái quả rơi tự do ra khỏi màn hình (sau khi đã trả lời xong)
                        fruit.vy += 0.5; 
                        fruit.y += fruit.vy;
                        fruit.rotation += 0.05;

                        if (fruit.y > height + 60) {
                            fruits[index] = spawnFruit(); // Quả cũ biến mất, mọc quả mới trên cây
                        }
                    }
                }
            });

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.opacity -= 0.015;
                if (ft.opacity <= 0) floatingTexts.splice(i, 1);
            }
        }

        function gameLoop() {
            update();
            ctx.clearRect(0, 0, width, height);
            drawBackground();
            drawTree();
            drawFruits();
            drawPlayer();
            drawEffects();
            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            resize();
            initFruits();
            gameLoop();
        };
    </script>
</body>
