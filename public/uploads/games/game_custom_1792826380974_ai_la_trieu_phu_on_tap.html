        question: "Cho hàm số \\(f(x)=-x^2+4x+1\\) trên đoạn \\([0;4]\\). Giá trị lớn nhất của hàm số bằng:",
        options: { A: "4", B: "5", C: "6", D: "7" },
        answer: "B",
        explanation: "Ta có \\(f'(x)=-2x+4=0 \\Rightarrow x=2 \\in [0;4]\\).<br>Tính các giá trị: \\(f(0)=1\\), \\(f(2)=5\\), \\(f(4)=1\\).<br>Vậy giá trị lớn nhất trên đoạn \\([0;4]\\) là 5.",

        hint: "Đây là một parabol quay bề lõm xuống dưới. Đỉnh parabol chính là nơi đạt GTLN!"

      {
        id: 6,
        question: "Đồ thị hàm số \\(y=\\frac{2x+1}{x-3}\\) có tiệm cận đứng là đường thẳng:",

        answer: "D",
        explanation: "Nghiệm của mẫu số là \\(x-3=0 \\Rightarrow x=3\\).<br>Thay \\(x=3\\) lên tử số ta được \\(2(3)+1 = 7 \\neq 0\\).<br>Do đó đường thẳng \\(x=3\\) là tiệm cận đứng.",
        topic: "Tiệm cận",
        hint: "Tiệm cận đứng của hàm phân thức hữu tỉ thường liên quan đến nghiệm của mẫu số."

      {
        id: 7,
        question: "Đồ thị hàm số \\(y=\\frac{2x+1}{x-3}\\) có tiệm cận ngang là đường thẳng:",

        explanation: "Thực hiện phép chia đa thức tử cho mẫu, ta được: \\(\\frac{x^2+1}{x-1} = x + 1 + \\frac{2}{x-1}\\).<br>Khi \\(x \\to \\pm\\infty\\), phần dư \\(\\frac{2}{x-1} \\to 0\\).<br>Vì vậy tiệm cận xiên là đường thẳng \\(y=x+1\\).",

        },
        answer: "A",
        explanation: "Tập xác định \\(D = \\mathbb{R} \\setminus \\{-2\\}\\).<br>Đạo hàm \\(f'(x)=\\frac{1 \\cdot 2 - (-1)\\cdot 1}{(x+2)^2} = \\frac{3}{(x+2)^2} > 0\\) với mọi \\(x \\neq -2\\).<br>Do đó hàm số đồng biến trên từng khoảng \\((-\\infty;-2)\\) và \\((-2;+\\infty)\\).",

        hint: "Sử dụng công thức tính đạo hàm nhanh (ad-bc)/(cx+d)^2 cho hàm phân thức bậc nhất / bậc nhất."

    const rewards = [
      "100", "200", "500", "1.000", "2.000",
      "5.000", "10.000", "20.000", "50.000", "100.000"
    ];
    
    /* TRẠNG THÁI TRÒ CHƠI */
    let currentQIndex = 0;
    let selectedOption = null;
    let isLocked = false;
    let lifelines = { fifty: true, audience: true, expert: true };
    let eliminatedOptions = [];
    
    /* HỆ THỐNG ÂM THANH TỔNG HỢP (Web Audio API) */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn("Audio Context không được hỗ trợ trên trình duyệt này.");
      }
    }

    function playTone(freq, type, duration, vol=0.1) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const sounds = {
      hover: () => playTone(800, 'sine', 0.05, 0.02),
      click: () => playTone(400, 'triangle', 0.1, 0.05),
      lock: () => {
        if (!soundEnabled || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 1.5);
          gain.gain.setValueAtTime(0, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.1);
          gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 1.4);
          gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 1.5);
        } catch(e) {}
      },
      correct: () => {
        playTone(523.25, 'sine', 0.4, 0.1); // C5
        setTimeout(() => playTone(659.25, 'sine', 0.4, 0.1), 100); // E5
        setTimeout(() => playTone(783.99, 'sine', 0.4, 0.1), 200); // G5
        setTimeout(() => playTone(1046.50, 'sine', 0.8, 0.1), 300); // C6
      },
      wrong: () => {
        playTone(300, 'sawtooth', 0.5, 0.1);
        setTimeout(() => playTone(280, 'sawtooth', 0.5, 0.1), 150);
        setTimeout(() => playTone(250, 'sawtooth', 0.8, 0.1), 300);
      },
      win: () => {
        const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, i) => {
          setTimeout(() => playTone(freq, 'square', 0.5, 0.05), i * 150);
        });
      }
    };

    function toggleSound() {
      soundEnabled = !soundEnabled;
      
      const renderBtn = (id) => {
        const btn = document.getElementById(id);
        if(!btn) return;
        if (soundEnabled) {
          btn.innerHTML = `<svg class="w-6 h-6"><use href="#icon-sound-on"></use></svg> ${id === 'sound-toggle-btn-start' ? 'ÂM THANH: BẬT' : ''}`;
          btn.className = btn.className.replace('text-slate-400', 'text-yellow-400');
          initAudio();
        } else {
          btn.innerHTML = `<svg class="w-6 h-6"><use href="#icon-sound-off"></use></svg> ${id === 'sound-toggle-btn-start' ? 'ÂM THANH: TẮT' : ''}`;
          btn.className = btn.className.replace('text-yellow-400', 'text-slate-400');
        }
      }
      renderBtn('sound-toggle-btn-start');
      renderBtn('sound-toggle-btn-game');
    }

    /* HÀM QUẢN LÝ GIAO DIỆN VÀ LOGIC */
    
    // Quản lý hàng đợi render MathJax an toàn
    let mathJaxPromise = Promise.resolve();
    function updateMath() {
      if (window.MathJax && window.MathJax.typesetPromise) {
        mathJaxPromise = mathJaxPromise.then(() => {
          return MathJax.typesetPromise().catch(err => console.log('MathJax err', err));
        });
      }
    }

    function renderMoneyTree() {
      // Đảo ngược mảng để in từ câu 10 xuống câu 1
      const treeHtml = rewards.map((reward, idx) => {
        const qNum = idx + 1;
        const isCurrent = idx === currentQIndex;
        const isPassed = idx < currentQIndex;
        const isMilestone = idx === 4 || idx === 9; // Câu 5 và 10
        
        let textCol = 'text-slate-400';
        let bgCol = 'border border-transparent';
        
        if (isCurrent) {
          textCol = 'text-yellow-400 font-bold';
          bgCol = 'bg-blue-800 border-yellow-500 rounded-lg scale-105';
        } else if (isPassed) {
          textCol = 'text-green-400';
        } else if (isMilestone) {
          textCol = 'text-white font-bold';
        }
        
        return `<div class="flex justify-between items-center px-4 py-2 transition-all ${bgCol} ${textCol}">
          <span class="w-8">${qNum}</span>
          <span class="flex-1 text-right">♦ ${reward}</span>
        </div>`;
      }).reverse().join('');
      
      document.getElementById('money-tree').innerHTML = treeHtml;
    }

    function renderLifelines() {
      const container = document.getElementById('lifelines-container');
      container.innerHTML = '';
      
      const list = [
        { id: 'fifty', label: 'Trợ giúp 50:50', icon: '<span class="font-bold text-lg">50:50</span>' },
        { id: 'audience', label: 'Hỏi ý kiến khán giả', icon: '<svg class="w-7 h-7"><use href="#icon-audience"></use></svg>' },
        { id: 'expert', label: 'Gọi điện chuyên gia', icon: '<svg class="w-7 h-7"><use href="#icon-expert"></use></svg>' }
      ];
      
      list.forEach(ll => {
        const isUsed = !lifelines[ll.id];
        let classNames = "flex items-center justify-center w-14 h-14 rounded-full border-2 transition-all focus:outline-none ";
        if (isUsed) {
           classNames += "bg-slate-700 border-slate-500 text-slate-500 cursor-not-allowed relative overflow-hidden";
        } else {
           classNames += "bg-blue-800 border-yellow-400 text-yellow-300 hover:bg-blue-600 hover:text-white hover:scale-110 cursor-pointer gameshow-shadow";
        }
        
        let cross = isUsed ? `<div class="absolute w-full h-[3px] bg-red-600 rotate-45 shadow-sm"></div><div class="absolute w-full h-[3px] bg-red-600 -rotate-45 shadow-sm"></div>` : '';
        
        container.innerHTML += `
          <button onclick="useLifeline('${ll.id}')" class="${classNames}" title="${ll.label}" ${isUsed ? 'disabled' : ''}>
            ${ll.icon}
            ${cross}
          </button>
        `;
      });
    }

    function renderQuestion() {
      const q = questions[currentQIndex];
      document.getElementById('question-number').innerText = `CÂU HỎI ${currentQIndex + 1}/10`;
      document.getElementById('question-reward').innerText = `${rewards[currentQIndex]} ĐIỂM`;
      document.getElementById('question-topic').innerText = `Chủ đề: ${q.topic}`;
      
      document.getElementById('question-text').innerHTML = q.question;
      
      const optionsDiv = document.getElementById('options-grid');
      optionsDiv.innerHTML = '';
      
      ['A','B','C','D'].forEach(opt => {
        optionsDiv.innerHTML += `
          <div id="opt-${opt}" onclick="handleOptionClick('${opt}')" onmouseenter="sounds.hover()"
               class="flex items-center p-4 md:p-6 rounded-2xl border-2 border-yellow-500 bg-blue-900 cursor-pointer transition-all duration-200 hover:bg-blue-700 hover:border-yellow-300 group">
            <span class="text-yellow-400 font-bold text-2xl mr-4 w-8 group-hover:text-white transition-colors">${opt}:</span> 
            <span class="text-lg md:text-xl font-medium math-content flex-1">${q.options[opt]}</span>
          </div>
        `;
      });
      
      document.getElementById('action-area').innerHTML = `
        <button id="btn-chot" onclick="lockAnswer()" class="hidden bg-amber-600 hover:bg-amber-500 text-white border-2 border-white px-10 py-3 rounded-full font-bold text-xl gameshow-shadow transition-transform hover:scale-105">CHỐT ĐÁP ÁN</button>
      `;
      
      renderMoneyTree();
      updateMath();
    }

    function handleOptionClick(opt) {
      if (isLocked || eliminatedOptions.includes(opt)) return;
      sounds.click();
      selectedOption = opt;
      
      // Reset tất cả (trừ bị loại)
      ['A','B','C','D'].forEach(o => {
        if (eliminatedOptions.includes(o)) return;
        const el = document.getElementById(`opt-${o}`);
        el.className = "flex items-center p-4 md:p-6 rounded-2xl border-2 border-yellow-500 bg-blue-900 cursor-pointer transition-all duration-200 hover:bg-blue-700 hover:border-yellow-300 group";
      });
      
      // Highlight ô được chọn
      const selEl = document.getElementById(`opt-${opt}`);
      selEl.className = "flex items-center p-4 md:p-6 rounded-2xl border-2 border-white bg-amber-600 cursor-pointer transition-all duration-200 scale-[1.02] shadow-[0_0_20px_rgba(217,119,6,0.9)] group";
      
      document.getElementById('btn-chot').classList.remove('hidden');
    }

    function lockAnswer() {
      if (!selectedOption || isLocked) return;
      isLocked = true;
      document.getElementById('btn-chot').classList.add('hidden');
      
      // Vô hiệu hoá click & hover
      ['A','B','C','D'].forEach(o => {
        const el = document.getElementById(`opt-${o}`);
        el.classList.add('pointer-events-none');
        if (!eliminatedOptions.includes(o) && o !== selectedOption) {
          el.classList.remove('hover:bg-blue-700', 'hover:border-yellow-300');
          el.classList.add('opacity-80');
        }
      });

      const selectedEl = document.getElementById(`opt-${selectedOption}`);
      selectedEl.classList.add('pulse-bg');
      selectedEl.classList.remove('opacity-80');
      
      sounds.lock();
      
      // Hiệu ứng chờ 1.5s
      setTimeout(() => {
        checkAnswer();
      }, 1500);
    }

    function checkAnswer() {
      const q = questions[currentQIndex];
      const isCorrect = selectedOption === q.answer;
      const selectedEl = document.getElementById(`opt-${selectedOption}`);
      
      selectedEl.classList.remove('pulse-bg');
      
      if (isCorrect) {
        sounds.correct();
        selectedEl.classList.remove('bg-amber-600');
        selectedEl.classList.add('bg-green-600');
        
        document.getElementById('action-area').innerHTML = `
          <div class="text-green-400 font-bold text-2xl mb-4 gameshow-text-glow uppercase tracking-wider">Chính xác!</div>
          <button onclick="nextQuestion()" class="bg-green-600 hover:bg-green-500 text-white border-2 border-white px-10 py-3 rounded-full font-bold text-xl gameshow-shadow transition-transform hover:scale-105">CÂU TIẾP THEO</button>
        `;
      } else {
        sounds.wrong();
        // Ô chọn sai thành màu đỏ
        selectedEl.classList.remove('bg-amber-600');
        selectedEl.classList.add('bg-red-700');
        
        // Hiện đáp án đúng màu xanh
        const correctEl = document.getElementById(`opt-${q.answer}`);
        correctEl.classList.remove('bg-blue-900', 'border-yellow-500', 'opacity-80');
        correctEl.classList.add('bg-green-600', 'border-white', 'gameshow-shadow', 'opacity-100');
        
        document.getElementById('action-area').innerHTML = `
          <div class="text-red-400 font-bold text-2xl mb-4 uppercase tracking-wider">Rất tiếc!</div>
          <div class="flex flex-wrap gap-4 justify-center">
            <button onclick="showExplanation()" class="bg-blue-700 hover:bg-blue-600 text-white px-6 py-3 border border-blue-400 rounded-full font-bold shadow-md transition-transform hover:scale-105">XEM GIẢI THÍCH</button>
            <button onclick="resetGame()" class="bg-slate-700 hover:bg-slate-600 text-white px-8 py-3 border border-slate-500 rounded-full font-bold shadow-md transition-transform hover:scale-105">CHƠI LẠI</button>
          </div>
        `;
      }
    }

    function nextQuestion() {
      currentQIndex++;
      if (currentQIndex >= questions.length) {
        showWinScreen();
      } else {
        selectedOption = null;
        isLocked = false;
        eliminatedOptions = [];
        renderQuestion();
      }
    }

    function showModal(contentHtml) {
      document.getElementById('modal-content').innerHTML = contentHtml;
      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    function useLifeline(type) {
      if (isLocked || !lifelines[type]) return;
      sounds.click();
      lifelines[type] = false;
      renderLifelines();
      
      const q = questions[currentQIndex];
      
      if (type === 'fifty') {
        const wrongOpts = ['A','B','C','D'].filter(opt => opt !== q.answer);
        wrongOpts.sort(() => Math.random() - 0.5);
        eliminatedOptions = [wrongOpts[0], wrongOpts[1]];
        
        eliminatedOptions.forEach(opt => {
          const el = document.getElementById(`opt-${opt}`);
          el.className = "flex items-center p-4 md:p-6 rounded-2xl border-2 border-transparent bg-transparent opacity-0 pointer-events-none transition-all duration-500";
        });
        
        if (selectedOption && eliminatedOptions.includes(selectedOption)) {
           selectedOption = null;
           document.getElementById('btn-chot').classList.add('hidden');
        }
      } 
      else if (type === 'audience') {
        let stats = { A:0, B:0, C:0, D:0 };
        let correctP = Math.floor(Math.random() * 31) + 40; // 40-70%
        stats[q.answer] = correctP;
        let remaining = 100 - correctP;
        
        let activeOpts = ['A','B','C','D'].filter(opt => opt !== q.answer && !eliminatedOptions.includes(opt));
        
        activeOpts.forEach((opt, idx) => {
          if (idx === activeOpts.length - 1) {
            stats[opt] = remaining;
          } else {
            let p = Math.floor(Math.random() * remaining);
            stats[opt] = p;
            remaining -= p;
          }
        });
        
        let chartHtml = `<h2 class="text-2xl font-bold text-yellow-400 mb-6 text-center">Ý KIẾN KHÁN GIẢ</h2>
                         <div class="bar-container mb-8">`;
        ['A','B','C','D'].forEach(opt => {
          if (!eliminatedOptions.includes(opt)) {
             chartHtml += `
               <div class="flex flex-col items-center w-1/4">
                 <div class="text-lg font-bold mb-2">${stats[opt]}%</div>
                 <div class="bar bg-blue-500 shadow-lg w-full max-w-[50px]" style="height: ${stats[opt] * 1.5}px"></div>
                 <div class="font-bold text-xl mt-3 text-yellow-400">${opt}</div>
               </div>
             `;
          }
        });
        chartHtml += `</div>
                      <div class="text-center"><button onclick="closeModal()" class="bg-blue-700 hover:bg-blue-600 text-white border border-blue-400 px-8 py-3 rounded-full font-bold">Đóng</button></div>`;
        showModal(chartHtml);
      }
      else if (type === 'expert') {
        let html = `
          <h2 class="text-2xl font-bold text-yellow-400 mb-6 text-center uppercase tracking-wide">Chuyên gia gợi ý</h2>
          <div class="bg-blue-900 border border-blue-400 p-6 rounded-xl mb-8 relative">
             <div class="absolute -top-4 -left-4 text-4xl">💡</div>
             <p class="text-xl text-center font-medium leading-relaxed italic">"${q.hint}"</p>
          </div>
          <div class="text-center">
             <button onclick="closeModal()" class="bg-green-700 hover:bg-green-600 text-white border border-green-500 px-8 py-3 rounded-full font-bold">Cảm ơn chuyên gia</button>
          </div>
        `;
        showModal(html);
      }
    }

    function showExplanation() {
      const q = questions[currentQIndex];
      let html = `
        <h2 class="text-2xl font-bold text-yellow-400 mb-4 uppercase tracking-wide">GIẢI THÍCH CHI TIẾT</h2>
        <div class="bg-slate-900 border border-slate-600 p-6 rounded-xl mb-6 text-lg text-left leading-relaxed math-content shadow-inner">
          ${q.explanation}
        </div>
        <div class="text-center">
          <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 px-8 py-3 rounded-full font-bold border border-slate-500">Đóng</button>
        </div>
      `;
      showModal(html);
      updateMath();
    }

    function showInstructions() {
      let html = `
        <h2 class="text-2xl font-bold text-yellow-400 mb-6 text-center uppercase tracking-widest">LUẬT CHƠI</h2>
        <ul class="list-none text-lg space-y-4 mb-8 text-slate-200 text-left">
          <li class="flex items-start gap-3"><span class="text-blue-400 font-bold">1.</span> Lần lượt trả lời 10 câu hỏi trắc nghiệm Toán 12 (Đơn điệu, cực trị, GTLN-GTNN, Tiệm cận).</li>
          <li class="flex items-start gap-3"><span class="text-blue-400 font-bold">2.</span> Chọn phương án đúng và bấm <b>CHỐT ĐÁP ÁN</b>. Bạn không thể thay đổi sau khi đã chốt.</li>
          <li class="flex items-start gap-3"><span class="text-blue-400 font-bold">3.</span> Trả lời sai, trò chơi kết thúc. Trả lời đúng 10 câu, bạn sẽ là TRIỆU PHÚ Toán Học!</li>
          <li class="flex items-start gap-3"><span class="text-blue-400 font-bold">4.</span> Có 3 quyền trợ giúp: <span class="text-yellow-400 font-semibold">50:50</span>, <span class="text-yellow-400 font-semibold">Hỏi khán giả</span> và <span class="text-yellow-400 font-semibold">Chuyên gia</span>. Mỗi quyền dùng 1 lần.</li>
        </ul>
        <div class="text-center">
          <button onclick="closeModal()" class="bg-blue-600 hover:bg-blue-500 border border-blue-400 px-10 py-3 rounded-full font-bold text-white shadow-lg">Đã hiểu</button>
        </div>
      `;
      showModal(html);
    }

    function showWinScreen() {
      sounds.win();
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('flex');
      
      document.getElementById('screen-win').classList.remove('hidden');
      document.getElementById('screen-win').classList.add('flex');
    }

    function startGame() {
      initAudio();
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-start').classList.remove('flex');
      
      document.getElementById('screen-game').classList.remove('hidden');
      document.getElementById('screen-game').classList.add('flex');
      
      currentQIndex = 0;
      selectedOption = null;
      isLocked = false;
      eliminatedOptions = [];
      lifelines = { fifty: true, audience: true, expert: true };
      
      renderLifelines();
      renderQuestion();
    }

    function resetGame() {
      document.getElementById('screen-win').classList.remove('flex');
      document.getElementById('screen-win').classList.add('hidden');
      closeModal();
      startGame();
    }

    function resetToStart() {
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('flex');
      document.getElementById('screen-start').classList.remove('hidden');
      document.getElementById('screen-start').classList.add('flex');
      closeModal();
    }

  </script>
</body>
</html>
